name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  profile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Validate profile files
        run: |
          test -f README.md
          test -f SECURITY.md
          test -f assets/header.png
          grep -q vx9forge README.md
